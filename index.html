<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Doc Agent — Collaborative Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/web/editor.css" />
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash" class="splash">
      <div class="splash-content">
        <div class="splash-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="splash-title">Voice Doc Agent</h1>
        <p class="splash-subtitle">AI-powered collaborative document editing with voice commands</p>
        <button id="start-btn" class="splash-start-btn" type="button">
          Get Started
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12h14m-7-7l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="splash-hint">Real-time collaboration &middot; Voice input &middot; AI assistance</p>
      </div>
      <div class="splash-footer">
        <span>Built with Yjs &middot; Tiptap &middot; Groq</span>
      </div>
    </div>

    <!-- Main App (hidden until splash dismissed) -->
    <div id="app" class="app-hidden">
    <header class="bar">
      <div class="identity">
        <span class="swatch" id="swatch"></span>
        <input id="name" type="text" aria-label="Your display name" maxlength="24" />
      </div>
      <div class="peers" id="peers"></div>
      <button id="copy-link" class="copy-link" type="button" title="Copy this document's link — anyone who opens it edits this same document">Copy link</button>
      <div class="status" id="status" data-state="connecting">connecting…</div>
    </header>

    <main>
      <div id="editor"></div>
    </main>

    <footer class="dock">
      <!-- The Assistant's spoken reply (design D26/D27). Shown for every
           tab; only spoken by the tab that sent the instruction. -->
      <div id="assistant-reply" class="assistant-reply" data-state="idle" aria-live="polite"></div>

      <!-- Ghost text for push-to-talk. Never written into the document (design D24). -->
      <div id="transcript" class="transcript" data-state="idle" aria-live="polite">
        Hold Right Ctrl or the mic button to speak an instruction
      </div>

      <form class="instruction-bar" id="instruction-form">
        <button id="ptt-button" class="ptt" type="button" aria-label="Hold to talk" title="Hold to talk (or hold Right Ctrl)">
          <span class="ptt-dot" aria-hidden="true"></span>Hold to talk
        </button>
        <input
          id="instruction-input"
          type="text"
          placeholder="Tell the agent what to do…"
          aria-label="Typed instruction for the agent"
          maxlength="500"
          autocomplete="off"
        />
        <button id="instruction-submit" type="submit">Send</button>
        <!-- Distinct from "speaking" (assistant-reply) and from the visible
             streaming edit itself — a search has no other visible sign it's
             in flight (design D35/task 35.2). -->
        <span id="agent-status" class="agent-status" data-state="idle" role="status" aria-live="polite"></span>
        <span id="instruction-status" class="instruction-status" role="status"></span>
      </form>
    </footer>
    </div><!-- /app -->

    <script type="module" src="/src/web/main.js"></script>
  </body>
</html>
