<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Doc Agent — Collaborative Document</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M12 4C7.58 4 4 7.58 4 12s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm-.8 14.34c-3.16-.39-5.6-3.08-5.6-6.34 0-.5.06-.97.17-1.43L9.2 14v.8c0 .88.72 1.6 1.6 1.6v1.94h.4zm5.52-2.03c-.21-.65-.8-1.11-1.52-1.11h-.8v-2.4c0-.44-.36-.8-.8-.8H10.4v-1.6h1.6c.44 0 .8-.36.8-.8V8h1.6c.88 0 1.6-.72 1.6-1.6v-.33c2.34.95 4 3.25 4 5.93 0 1.66-.64 3.18-1.68 4.31z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/web/editor.css" />
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash" class="splash">
      <div class="splash-content">
        <!-- The logo carries the name, so no separate wordmark here. -->
        <!-- Ink version: the splash is pink paper now, not a dark screen. -->
        <img class="splash-logo" src="/penpal-logo.png" alt="PenPal" />
        <p class="splash-subtitle">A document you talk to — it listens, thinks with you, and writes alongside you</p>
        <button id="start-btn" class="splash-start-btn" type="button">
          Get Started
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12h14m-7-7l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="splash-hint">Real-time collaboration &middot; Voice input &middot; AI assistance</p>
      </div>
      <div class="splash-footer">
        <span>Built with Yjs &middot; Tiptap &middot; Groq</span>
      </div>
    </div>

    <!-- Main App (hidden until splash dismissed) -->
    <div id="app" class="app-hidden">
    <header class="bar">
      <!-- Rumaisa's brand block, with the PenPal artwork in place of the
           placeholder mark and wordmark (the logo carries the name). -->
      <div class="brand">
        <img class="brand-logo" src="/penpal-logo.png" alt="PenPal" />
      </div>
      <span class="bar-divider" aria-hidden="true"></span>
      <div class="identity">
        <span class="swatch" id="swatch"></span>
        <input id="name" type="text" aria-label="Your display name" maxlength="24" />
      </div>
      <div class="peers" id="peers"></div>
      <button id="copy-link" class="copy-link" type="button" title="Copy this document's link — anyone who opens it edits this same document">Copy link</button>
      <div class="status" id="status" data-state="connecting">connecting…</div>
    </header>

    <main>
      <div id="editor"></div>
    </main>

    <footer class="dock">
      <!-- The Assistant's spoken reply (design D26/D27). Shown for every
           tab; only spoken by the tab that sent the instruction. -->
      <div id="assistant-reply" class="assistant-reply" data-state="idle" aria-live="polite"></div>

      <!-- Ghost text for push-to-talk. Never written into the document (design D24). -->
      <div id="transcript" class="transcript" data-state="idle" aria-live="polite">
        Hold Right Ctrl or the mic button to speak an instruction
      </div>

      <form class="instruction-bar" id="instruction-form">
        <button id="ptt-button" class="ptt" type="button" aria-label="Hold to talk" title="Hold to talk (or hold Right Ctrl)">
          <span class="ptt-dot" aria-hidden="true"></span>Hold to talk
        </button>
        <input
          id="instruction-input"
          type="text"
          placeholder="Tell the agent what to do…"
          aria-label="Typed instruction for the agent"
          maxlength="500"
          autocomplete="off"
        />
        <button id="instruction-submit" type="submit">
          Send
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <!-- Distinct from "speaking" (assistant-reply) and from the visible
             streaming edit itself — a search has no other visible sign it's
             in flight (design D35/task 35.2). -->
        <span id="agent-status" class="agent-status" data-state="idle" role="status" aria-live="polite"></span>
        <span id="instruction-status" class="instruction-status" role="status"></span>
      </form>
    </footer>
    </div><!-- /app -->

    <script type="module" src="/src/web/main.js"></script>
  </body>
</html>
